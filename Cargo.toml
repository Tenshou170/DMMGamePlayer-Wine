[package]
name = "DMMGamePlayer-Setup-Wine"
version = "5.5.19"
edition = "2021"
authors = ["tenshou170"]
description = "Native Win32 setup wizard and registry configurator for DMM Game Player on Wine / Proton"
license = "MIT"

[[bin]]
name = "DMMGamePlayer-Setup-Wine"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "z"
strip = true

[dependencies]
windows-registry = "0.100"
tinyjson = "2.5"
once_cell = "1.20"
pelite = "0.10"
sevenz-rust2 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_UI"
]

[build-dependencies]
embed-resource = "2.4"
cc = "1.1"

[patch.crates-io]
embed-resource = { git = "https://github.com/nabijaczleweli/rust-embed-resource.git", rev = "e98e9aa28d66b0c2ff43516b41847cac372310dd" }
